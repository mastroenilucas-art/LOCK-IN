# Netlify settings for the web version (optional: for Android clients, using the coach screen
# on a laptop, testing before TestFlight, and hosting privacy.html).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
